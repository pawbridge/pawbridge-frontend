name: Environment build verification
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint (no warnings)
        run: npm run lint
      - name: Lint policy regression
        run: npm run test:lint-policy
      - run: npm run test:environment
      - name: Icon font subset covers every icon
        run: npm run test:icons
      - name: Daily visitor contract
        run: npm run test:visits
      - name: Chat connection regressions
        run: npm run test:chat
      - name: Unit tests
        run: npm run test:unit
      - name: SEO metadata
        run: npm run test:seo
      - name: Statistics helpers
        run: npm run test:stats
      - run: npm run build:dev
        env:
          VITE_API_BASE_URL: http://localhost:28080
      - run: npm run build:prod
        env:
          VITE_API_BASE_URL: https://api.pawbridge.kr
